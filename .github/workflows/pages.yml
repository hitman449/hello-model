name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; don't cancel a deploy that's already running.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run engine tests
        run: node --test tests/*.test.js

  deploy:
    # Only publish from main, and only after the tests pass.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow defaults, so read access must be repeated here.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html ads.txt css js _site/
      # Version the CSS/JS URLs with the commit, so a browser never pairs a new
      # index.html with an old cached script or stylesheet.
      - name: Add cache-busting versions to asset links
        run: |
          VERSION="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"((css|js)/[^\"?]+\.(css|js))\"#\1=\"\2?v=${VERSION}\"#g" _site/index.html
          grep -oE '(href|src)="(css|js)/[^"]+"' _site/index.html
          if grep -qE '(href|src)="(css|js)/[^"?]+"' _site/index.html; then
            echo "::error::An asset link in index.html was not versioned"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
